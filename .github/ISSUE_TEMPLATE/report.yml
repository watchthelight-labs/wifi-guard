name: Report
description: A bug, or a report from another machine or Wi-Fi driver
body:
  - type: input
    id: machine
    attributes:
      label: Machine and Wi-Fi card
      placeholder: Legion 5 15IAX10 (83F0), MediaTek MT7925 (14C3:7925)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS build, OpenCore, kexts under test, wifi-guard version, stage
      placeholder: 26.7.1 (25G241), OC 1.0.8, MtkWlan 0.11.3 + MtkWlanNative 0.4.11, wifi-guard 0.1.0, stage E
    validations:
      required: true
  - type: textarea
    id: pending
    attributes:
      label: pending.json of the attempt
      render: json
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The attempt's lines from /Users/Shared/wifi-guard/wifi-guard.log
      description: Replace your local IP addresses if you like; the reason text is what matters.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Whether Wi-Fi worked on that boot, and what the guard did instead.
    validations:
      required: true
